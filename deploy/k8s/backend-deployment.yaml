apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # 会话状态与步骤锁为进程内内存态，副本数必须为 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gdat/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: temp-storage
              mountPath: /app/TempStorage
            - name: logs
              mountPath: /app/Logs
            - name: model-output
              mountPath: /app/ModelOutput
            - name: report-output
              mountPath: /app/ReportOutput
            - name: api-output
              mountPath: /app/APIOutput
      volumes:
        # 如需 Pod 重启后保留数据，可改为 PVC
        - name: temp-storage
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: model-output
          emptyDir: {}
        - name: report-output
          emptyDir: {}
        - name: api-output
          emptyDir: {}
