[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GeneralDataAnalysisTool"
version = "0.1.0"
description = "A general-purpose data analysis tool"
authors = [
    {name = "Author Name", email = "author@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "pymongo>=4.0.0",
    "redis>=4.0.0",
    "psycopg2>=2.9.0",
    "openpyxl>=3.0.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "pydantic>=1.8.0",
    "requests>=2.25.0",
    "jinja2>=3.0.0",
    "python-multipart>=0.0.5",
    "pyarrow>=17.0.0",
    "wordcloud>=1.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0.0",
    "flake8>=3.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Src*"]
namespaces = false

[project.scripts]
general-data-analyzer = "Src.DataAnalyzer.core:main"

[tool.unimport]

sources = [
    "Src",
    "main.py",
    "tests",
    "examples"
]

requirements = [
    "requirements.txt"
]

exclude = [
    "Logs/",           # 日志目录，无Python代码
    "Data/",           # 数据目录，无Python代码
    "Notebooks/",      # Jupyter notebooks (unimport 默认不检查 .ipynb)
    "docs/",           # 文档
    "test_images/",    # 图片
    "Src/generaldataanalysistool.egg-info/", # 构建产物
    "__pycache__",     # Python 缓存
    "\\.git",          # Git 目录
]

include_star_import = true

check_init_files = true
