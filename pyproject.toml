[project]
name = "generaldataanalysistool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "plotly>=6.2.0",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "scrapy>=2.13.3",
    "seaborn>=0.13.2",
    "selenium>=4.34.2",
    "sqlalchemy",
    "statsmodels>=0.14.5",
    "uvicorn[standard]>=0.35.0",
    "pymongo>=4.10.1",
    "redis>=6.5.2",
]

[tool.unimport]

sources = [
    "Src",
    "main.py",
    "tests",
    "examples"
]

requirements = [
    "requirements.txt"
]

exclude = [
    "Logs/",           # 日志目录，无Python代码
    "Data/",           # 数据目录，无Python代码
    "Notebooks/",      # Jupyter notebooks (unimport 默认不检查 .ipynb)
    "docs/",           # 文档
    "test_images/",    # 图片
    "Src/generaldataanalysistool.egg-info/", # 构建产物
    "__pycache__",     # Python 缓存
    "\\.git",          # Git 目录
]

include_star_import = true

check_init_files = true
